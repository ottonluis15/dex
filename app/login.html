<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Entrar — Dex Advocacia</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo"><h1><svg class="icon-svg icon-svg-xl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/></svg> Dex</h1><p>Sistema de Advocacia</p></div>
    <h2 class="auth-title">Bem-vindo de volta</h2>
    <p class="auth-subtitle">Faça login para acessar seu escritório</p>
    <div id="alert" style="display:none"></div>
    <form id="loginForm" onsubmit="return handleLogin(event)">
      <div class="form-group">
        <label class="form-label">E-mail</label>
        <input type="email" class="form-input" id="email" placeholder="seu@email.com" required>
      </div>
      <div class="form-group">
        <label class="form-label">Senha</label>
        <input type="password" class="form-input" id="password" placeholder="********" required>
      </div>
      <div style="text-align:right;margin-bottom:16px">
        <a href="forgot-password.html" style="font-size:13px;color:var(--accent)">Esqueceu a senha?</a>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center">Entrar</button>
    </form>
    <div class="auth-footer">
      Não tem conta? <a href="register.html">Criar escritório</a>
    </div>
  </div>
</div>
<script>
function handleLogin(e){
  e.preventDefault();
  const email=document.getElementById('email').value;
  const password=document.getElementById('password').value;
  const offices=JSON.parse(localStorage.getItem('dex_offices')||'[]');
  let found=null,office=null;
  for(const o of offices){
    const user=o.users.find(u=>u.email===email&&u.password===password&&u.isActive);
    if(user){found=user;office=o;break;}
  }
  if(!found){
    document.getElementById('alert').style.display='flex';
    document.getElementById('alert').className='alert alert-error';
    document.getElementById('alert').innerHTML='<svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg> E-mail ou senha inválidos';
    return false;
  }
  const session={userId:found.id,name:found.name,email:found.email,role:found.role,officeId:office.id,officeName:office.name,avatar:found.avatar};
  localStorage.setItem('dex_session',JSON.stringify(session));
  window.location.href='dashboard.html';
  return false;
}
if(localStorage.getItem('dex_session'))window.location.href='dashboard.html';
</script>
</body>
</html>
