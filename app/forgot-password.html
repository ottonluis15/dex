<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Recuperar Senha — Dex Advocacia</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo"><h1><svg class="icon-svg icon-svg-xl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/></svg> Dex</h1><p>Sistema de Advocacia</p></div>
    <h2 class="auth-title">Recuperar Senha</h2>
    <p class="auth-subtitle">Informe seu e-mail para receber o link de recuperação</p>
    <div id="alert" style="display:none"></div>
    <form onsubmit="return handleForgot(event)">
      <div class="form-group">
        <label class="form-label">E-mail cadastrado</label>
        <input type="email" class="form-input" id="email" placeholder="seu@email.com" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center">Enviar Link de Recuperacao</button>
    </form>
    <div class="auth-footer"><a href="login.html">Voltar ao login</a></div>
  </div>
</div>
<script>
function handleForgot(e){
  e.preventDefault();
  const email=document.getElementById('email').value;
  const offices=JSON.parse(localStorage.getItem('dex_offices')||'[]');
  let found=false;
  for(const o of offices){if(o.users.some(u=>u.email===email)){found=true;break;}}
  const a=document.getElementById('alert');a.style.display='flex';
  if(found){a.className='alert alert-success';a.innerHTML='<svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg> Link de recuperação enviado para '+email+'.';}
  else{a.className='alert alert-error';a.innerHTML='<svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg> E-mail não encontrado no sistema.';}
  return false;
}
</script>
</body>
</html>
